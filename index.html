<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Movie Elite</title>

<script type="application/ld+json">
{
 "@context": "https://schema.org",
 "@type": "Movie",
 "name": "{{title}}",
 "datePublished": "{{release}}",
 "image": "https://image.tmdb.org/t/p/w500{{poster}}",
 "aggregateRating": {
   "@type": "AggregateRating",
   "ratingValue": "{{rating}}"
 }
}
</script>

<style>
body {
  margin: 0;
  background: #020617;
  color: white;
  font-family: Arial;
}
.banner {
  height: 60vh;
  background-size: cover;
  display: flex;
  align-items: flex-end;
  padding: 20px;
}

.content {
  padding: 20px;
}

iframe {
  width: 100%;
  height: 400px;
}
header {
  padding: 15px;
  background: #020617;
  position: sticky;
  top: 0;
  z-index: 10;
}

#search {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  border: none;
}

.hero {
  height: 60vh;
  background-size: cover;
  display: flex;
  align-items: flex-end;
  padding: 20px;
}

.hero h1 {
  font-size: 40px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px,1fr));
  gap: 15px;
  padding: 20px;
}

.card {
  transition: 0.3s;
  cursor: pointer;
}

.card:hover {
  transform: scale(1.08);
}

.card img {
  width: 100%;
  border-radius: 10px;
}
</style>
</head>

<body>

<header>
  <input id="search" placeholder="Search movies...">
</header>

<div class="hero" id="hero"></div>
<div class="grid" id="movies"></div>
<script src="https://icungsilet.github.io/app.js/app.js"></script>

<div class="banner" id="banner"></div>
<div class="content" id="content"></div>
<script src="https://icungsilet.github.io/app.js/detail.js"></script>
</body>
</html>
