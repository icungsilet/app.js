<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ViralScreen Ote Jalaludin</title>
<meta property="og:title" content="ViralScreen">
<meta property="og:type" content="website">
<meta property="og:description" content="Discover trending movies and TV shows">
<meta name="description" content="Watch trending movies, TV shows and popular people.">
<meta name="theme-color" content="#0f172a">

<script type="application/ld+json">
{
 "@context": "https://schema.org",
 "@type": "Movie",
 "name": "{{title}}",
 "datePublished": "{{release}}",
 "image": "https://image.tmdb.org/t/p/w500{{poster}}",
 "aggregateRating": {
   "@type": "AggregateRating",
   "ratingValue": "{{rating}}"
 }
}
</script>

<style>

.movie {
  max-width: 800px;
  margin: auto;
  color: white;
}

body {
  background: #020617;
}

img {
  width: 100%;
  border-radius: 10px;
}

iframe {
  width: 100%;
  height: 400px;
}



</style>

</head>

<body>

<div class="movie">

<h1>{{title}}</h1>

<img src="https://image.tmdb.org/t/p/w500{{poster}}">

<p>{{overview}}</p>

<div class="player">
  <iframe src="https://www.youtube.com/embed/{{trailer}}" allowfullscreen></iframe>
</div>

<p><b>Release:</b> {{release}}</p>
<p><b>Rating:</b> ⭐ {{rating}}</p>

</div>

<script>

const BASE = "https://vxz.megadon8787.workers.dev";

async function generatePost(id) {
  const movie = await fetch(`${BASE}/movie/${id}`).then(r => r.json());
  const vids = await fetch(`${BASE}/movie/${id}/videos`).then(r => r.json());

  const trailer = vids.results.find(v => v.type === "Trailer");

  const html = `
<h1>${movie.title}</h1>
<img src="https://image.tmdb.org/t/p/w500${movie.poster_path}">
<p>${movie.overview}</p>

<iframe src="https://www.youtube.com/embed/${trailer?.key || ""}"></iframe>

<p>Release: ${movie.release_date}</p>
<p>Rating: ${movie.vote_average}</p>
`;

  console.log(html);
}

generatePost(550); // contoh Fight Club




async function autoPost() {
  const res = await fetch(`${BASE}/movie/popular`);
  const data = await res.json();

  data.results.forEach(m => {
    generatePost(m.id);
  });
}

</script>
</body>
</html>
