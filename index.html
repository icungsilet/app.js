<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Movie Elite</title>

<style>
body {
  margin: 0;
  background: #020617;
  color: white;
  font-family: Arial;
}

header {
  padding: 15px;
  background: #020617;
  position: sticky;
  top: 0;
  z-index: 10;
}

#search {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  border: none;
}

.hero {
  height: 60vh;
  background-size: cover;
  display: flex;
  align-items: flex-end;
  padding: 20px;
}

.hero h1 {
  font-size: 40px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px,1fr));
  gap: 15px;
  padding: 20px;
}

.card {
  transition: 0.3s;
  cursor: pointer;
}

.card:hover {
  transform: scale(1.08);
}

.card img {
  width: 100%;
  border-radius: 10px;
}
</style>
</head>

<body>

<header>
  <input id="search" placeholder="Search movies...">
</header>

<div class="hero" id="hero"></div>

<div class="grid" id="movies"></div>

<script src="https://icungsilet.github.io/app.js/app.js"></script>
</body>
</html>
